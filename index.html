  <style>
:root {
  --ink: #1c1916;
  --muted: #5c564e;
  --paper: #f3efe6;
  --card: #fffdf8;
  --line: #e4ddd2;
  --accent: #164e63;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, #fffdf8);
  --good: #0f7a4a;
  --good-bg: #e7f6ee;
  --bad: #b42318;
  --bad-bg: #fdecea;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  min-height: 100%;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  padding: 12px 16px max(20px, env(safe-area-inset-bottom));
}
button, input {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, p { margin: 0; }
.kicker {
  color: var(--accent);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.home-title {
  font-size: 28px;
  letter-spacing: -0.6px;
  line-height: 1.15;
  margin: 0 0 8px;
}
.lead { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 0 0 18px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-btn {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 8px;
  cursor: pointer;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(28,25,22,0.04);
}
.card-title { font-weight: 800; font-size: 20px; }
.card-title.sm { font-size: 17px; }
.teaser { color: var(--muted); font-size: 15px; margin-top: 4px; line-height: 1.4; }
.meta { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 14px; }
.banner {
  background: var(--accent-soft);
  border: none;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}
.back {
  display: inline-block;
  min-height: 40px;
  padding: 8px 12px 8px 0;
  background: transparent;
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-align: left;
}
h1.page { font-size: 26px; margin: 4px 0 6px; letter-spacing: -0.4px; }
h1.quiz { font-size: 22px; margin: 4px 0; letter-spacing: -0.3px; }
h2.sec { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 16px; }
.lesson { margin-bottom: 10px; }
.lesson-h { font-weight: 800; margin-bottom: 6px; }
.lesson-b { font-size: 15px; line-height: 1.5; }
.example {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--paper);
  border-radius: 10px;
  font-size: 14px;
  font-style: italic;
}
.vocab { padding: 0; overflow: hidden; margin-bottom: 12px; }
.vocab-row {
  display: grid;
  grid-template-columns: 1fr 1fr 0.9fr;
  gap: 0;
  font-size: 13px;
  padding: 10px 12px;
  line-height: 1.35;
  border-top: 1px solid var(--line);
}
.vocab-head {
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  border-top: none;
}
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.q { margin: 0 0 8px; font-size: 18px; line-height: 1.45; font-weight: 700; }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.opt {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 17px;
  font-weight: 600;
  text-align: left;
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}
.opt.chosen { background: var(--accent-soft); border-color: var(--accent); }
.opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { margin-top: 8px; border-radius: 12px; padding: 12px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb-title { font-weight: 800; }
.primary, .ghost, .submit, .linkish {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: none;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.primary, .submit { background: var(--accent); color: #fff; margin-top: 14px; }
.ghost { background: var(--accent-soft); color: var(--accent); margin-top: 10px; }
.linkish {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  margin-top: 8px;
  margin-bottom: 12px;
}
.passage {
  margin: 0 0 14px;
  line-height: 1.65;
  font-size: 16px;
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px;
}
.gap {
  display: inline-block;
  min-width: 52px;
  margin: 0 3px;
  padding: 0 6px;
  border-bottom: 2px solid var(--muted);
  color: var(--muted);
  font-weight: 700;
  border-radius: 4px;
}
.gap.on {
  border-bottom-color: var(--accent);
  color: var(--accent);
  background: #fff;
}
.result { text-align: center; padding: 24px 16px; }
.score { font-size: 42px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
.pct { font-size: 16px; font-weight: 700; margin: 4px 0 8px; }
.mistake { border-top: 1px solid var(--line); padding: 10px 0; }
.mistake:first-of-type { border-top: none; }
.m-q { font-weight: 700; margin-bottom: 4px; }
.m-bad { font-size: 14px; color: var(--bad); }
.m-good { font-size: 14px; color: var(--good); }
.m-ex { font-size: 14px; color: var(--ink); margin-top: 4px; line-height: 1.4; }
.foot { margin-top: 22px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.tests { margin: 18px 0 8px; }
input[type="text"], input[type="password"] {
  width: 100%;
  min-height: 52px;
  font-size: 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  padding: 12px 14px;
  margin-bottom: 10px;
  background: #fff;
}
label.pw {
  display: block;
  font-weight: 700;
  margin: 0 0 8px;
  font-size: 15px;
}
.err {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  font-weight: 700;
}
.wait { color: var(--muted); font-size: 15px; margin-top: 8px; }
.sol-item { border-top: 1px solid var(--line); padding: 12px 0; }
.sol-item:first-of-type { border-top: none; }
.sol-a { font-weight: 700; color: var(--good); margin: 6px 0; }
.quiz-block { margin-bottom: 16px; }

.eltern-link {
  display: block;
  width: 100%;
  margin-top: 28px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  min-height: 36px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  border-radius: 99px;
  padding: 3px 8px;
  margin-left: 6px;
}
.badge.ok { background: var(--good-bg); color: var(--good); }
.badge.no { background: var(--bad-bg); color: var(--bad); }
.badge.mute { background: var(--paper); color: var(--muted); }
.task-log { border-top: 1px solid var(--line); padding: 10px 0; }
.task-log:first-of-type { border-top: none; }
.task-log .when { font-size: 13px; color: var(--muted); margin-top: 2px; }
.task-log .given { font-size: 14px; margin-top: 2px; }
.warn-list { margin: 8px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.45; }
.retry-note { font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 600; }

.warn-box {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 0 12px;
  font-size: 15px;
  line-height: 1.45;
  font-weight: 650;
}
.warn-box.warn {
  background: #fff4e5;
  color: #8a4b08;
}
.warn-box.info {
  background: var(--paper);
  color: var(--muted);
  font-weight: 500;
}

  </style>
</head>

  <script>
  const DATA = {"app":{"name":"Englisch Klassenarbeit","title":"Englisch Klassenarbeit","kicker":"KLASSE 8 · GYMNASIUM NRW","lead":"Übungen zu Simple Present und Present Progressive, Modalersatzformen (have to, be able to, be allowed to) und Gerunds – auf dem Niveau der Klassenarbeit, mit zusätzlichen Aufgaben zum Üben. Für die Wertung zählt nur der erste Versuch.","footer":"Lösungen sind geschützt. Für die Wertung zählt nur der erste Versuch je Aufgabe. Auf einem Android-Tablet in Chrome über das Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ ablegen.","storageKey":"lern-app:englisch-ka:progress-v1"},"topics":[{"id":"tenses","title":"Simple Present & Progressive","teaser":"Gewohnheiten, Fahrpläne und Fakten gegen Handlungen jetzt und persönliche Absprachen.","lessonTitle":"Wann welche Zeit?","tables":[],"lesson":[{"heading":"Simple Present","body":"Für Gewohnheiten, Fakten und feste Zeitpläne (Uhrzeiten, Fahrpläne, offizielle Termine). Bildung: I/you/we/they start, he/she/it starts. Verneinung: don't/doesn't + Infinitiv.","examples":["The workshop starts at 8 a.m.","The group with the best idea wins a prize.","Water boils at 100 degrees."]},{"heading":"Present Progressive","body":"Für Handlungen, die gerade laufen, für befristete Situationen und für persönliche Pläne und Absprachen in der Zukunft. Bildung: am/is/are + Verb-ing. Kurze Formen, wo möglich: I'm, she's, they're.","examples":["I'm taking part in a workshop on Saturday.","Look! They are planting trees.","Kelly Holmes is opening the new sports centre."]},{"heading":"Typische Signale","body":"Simple Present: usually, always, every day, at 8 a.m., on Monday (als Fahrplan). Present Progressive: now, look!, listen!, at the moment, this week, tomorrow (als Absprache).","examples":["Their plane arrives at 10.30. (Fahrplan)","My father is taking me to the match. (Arrangement)"]},{"heading":"Tipp für die Klassenarbeit","body":"Frage: Ist es ein Programm/eine Uhrzeit/eine Regel? → Simple Present. Ist es eine persönliche Absprache oder etwas, das gerade passiert? → Present Progressive. Verben wie understand, know, like, want stehen fast immer im Simple Present.","examples":["I don't understand this sentence.","Are you coming tomorrow?"]}],"quizzes":[{"id":"env-project","title":"The environment project","blurb":"Dialog aus der Klassenarbeit: Simple Present oder Present Progressive, 13 Lücken. Kurze Formen, wo möglich.","questions":[{"prompt":"Lücke 1: how _____ (get) information …","hint":"Kurzform ist hier bei are nicht möglich.","passage":"Tony: Hi Jim, how ___ (get) information for your environment project?\nJim: I ___ (take part) in a workshop at Faraway Travel. It's called “Eco-friendly travel and me”. It ___ (take place) on Saturday.\nTony: That sounds good! But I hope it ___ (not begin) too early …\nJim: Well, the workshop ___ (start) at 8 a.m. and ___ (go) until 4 p.m.\nTony: Wow, that's early and it's a full day. What ___ (do) so long?\nJim: From 8 a.m. to 12:30 p.m. the travel agents ___ (talk) to us about different eco travel topics, then from 1:30 p.m. to 3:30 p.m. we ___ (work) in small groups and ___ (plan) eco-friendly school trips. The group with the best idea ___ (win) a trip to Wild Nature Park! So will you come or not?\nTony: Are you joking? With a prize like that, of course I ___ (go) with you!\nJim: Good! I ___ (interview) one of the travel agents too and you can help me."},{"prompt":"Lücke 2: I _____ (take part) in a workshop …","passage":"Tony: Hi Jim, how ___ (get) information for your environment project?\nJim: I ___ (take part) in a workshop at Faraway Travel. It's called “Eco-friendly travel and me”. It ___ (take place) on Saturday.\nTony: That sounds good! But I hope it ___ (not begin) too early …\nJim: Well, the workshop ___ (start) at 8 a.m. and ___ (go) until 4 p.m.\nTony: Wow, that's early and it's a full day. What ___ (do) so long?\nJim: From 8 a.m. to 12:30 p.m. the travel agents ___ (talk) to us about different eco travel topics  skiing."],["look forward to","I look forward to seeing you."]]}],"lesson":[{"heading":"Was ist ein Gerund?","body":"Ein Gerund ist ein Verb mit -ing, das wie ein Nomen benutzt wird. Nach vielen Verben (enjoy, mind, keep, stop, finish, hate, start), nach Präpositionen und nach Wendungen wie good at oder tired of steht das Gerund – nicht to + Infinitiv.","examples":["I enjoy riding my bike.","I'm tired of waiting.","She's good at skiing."]},{"heading":"Vorsicht bei to","body":"In look forward to, get used to und ähnlich ist to eine Präposition. Danach kommt ebenfalls das Gerund: look forward to seeing you, get used to having more time.","examples":["I'm looking forward to seeing you.","I can't get used to getting up so early."]},{"heading":"Rechtschreibung","body":"Wie beim Present Progressive: ein stummes -e am Ende fällt weg (write → writing, ride → riding). Nach kurzem betontem Vokal wird der Konsonant oft verdoppelt (get → getting, swim → swimming).","examples":["writing, riding, coming","getting, swimming, sitting"]},{"heading":"Kasten wie im Arbeitsblatt","body":"Typische Verbindungen aus dem Übungsblatt: feel like, worried about, tired of, crazy about, dream of, get used to, thinking of, good at, look forward to – danach immer Verb-ing.","examples":["worried about moving","dream of winning","look forward to having fun"]}],"quizzes":[{"id":"dean-email","title":"Dean's email","blurb":"Aus dem Gerund-Arbeitsblatt: Verb/Adjektiv + Präposition + Gerund. feel like writing ist schon als Beispiel eingesetzt.","questions":[{"prompt":"Lücke 1: I was a bit _____ moving to Jackson","hint":"Adjektiv + Präposition aus dem Kasten.","passage":"Hey Lance, everything OK? I know, I just wrote three weeks ago, but I feel like writing – I have more time now. I was a bit ___ moving to Jackson, but it was the best thing to do. I was so ___ driving from Sunrise Pass to Jackson and back every day. It's funny, but I can't ___ having more time for friends after homework.\nHey, I've beco   function queueIntegrity(opts) {
    integrityQueue = integrityQueue.then(function () { return applyIntegrity(opts); }, function () { return applyIntegrity(opts); });
    return integrityQueue;
  }
  function normalize(value) {
    return String(value).trim().toLowerCase().replace(/\s+/g, " ");
  }
  function b64dec(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64enc(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  async function hashAnswer(value) {
    const enc = new TextEncoder();
    const norm = enc.encode(normalize(value));
    const salt = b64dec(hashSalt);
    const msg = new Uint8Array(salt.length + norm.length);
    msg.set(salt, 0);
    msg.set(norm, salt.length);
    return b64enc(await crypto.subtle.digest("SHA-256", msg));
  }
  async function isRight(topicId, quizId, index, given) {
    const key = quizKey(topicId, quizId);
    const hashes = (answerHashes[key] && answerHashes[key][index]) || [];
    const h = await hashAnswer(given);
    return hashes.indexOf(h) !== -1;
  }
  async function deriveKey(password, saltB64) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64dec(saltB64), iterations: ITERATIONS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }
  async function unlockWithPassword(password) {
    const key = await deriveKey(password, vault.salt);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64dec(vault.iv) },
      key,
      b64dec(vault.ciphertext)
    );
    solutions = JSON.parse(new TextDecoder().decode(plain));
    unlocked = true;
    pwError = "";
  }
  function findTopic(id) {
    for (let i = 0; i < topics.length; i++) if (topics[i].id === id) return topics[i];
    return null;
  }
  function findQuiz(topicId, quizId) {
    const topic = findTopic(topicId);
    if (!topic) return null;
    for (let i = 0; i < topic.quizzes.length; i++) if (topic.quizzes[i].id === quizId) return topic.quizzes[i];
    return null;
  }
  function quizKey(topicId, quizId) { return topicId + ":" + quizId; }
  function esc(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function arg(value) { return encodeURIComponent(value == null ? "" : String(value)); }
  function recordScore(topicId, quizId, score, total) {
    const key = quizKey(topicId, quizId);
    const old = progress[key];
    progress = Object.assign({}, progress);
    progress[key] = {
      best: Math.max(old && old.best ? old.best : 0, score),
      last: score,
      total: total
    };
    saveProgress(progress);
  }
  function startQuiz(topicId, quizId) {
    quizState = { index: 0, typed: "", chosen: null, checked: false, ok: false, score: 0, runScore: 0, mistakes: [], retry: false, attemptNo: 0 };
    screen = { name: "quiz", topicId: topicId, quizId: quizId };
    pwError = "";
    render();
  }
  function passageHtml(text, current) {
    const parts = text.split("___");
    let html = '<p class="passage">';
    for (let i = 0; i < parts.length; i++) {
      html += esc(parts[i]);
      if (i < parts.length - 1) {
        html += '<span class="gap' + (i === current ? " on" : "") + '">' + (i + 1) + "</span>";
      }
    }
    return html + "</p>";
  }
  function passwordForm(act, label, button) {
    let html = '<form class="card" data-act="password-form" data-next="' + esc(act) + '" style="margin-top:14px">';
    html += '<label class="pw" for="pw-input">' + esc(label || "Passwort für die Lösungen") + "</label>";

    html += '<button type="submit" class="submit"' + (pwBusy ? " disabled" : "") + ">" + (pwBusy ? "Prüfe …" : esc(button || "Lösungen entsperren")) + "</button>";

  }
  function solutionList(topicId, quizId) {

  function quizView(quiz) {
    const st = quizState;
    const question = quiz.questions[st.index];
    if (!question) return "";
    const total = quiz.questions.length;
    const options = question.options;
    const pct = Math.round(((st.index + (st.checked ? 1 : 0)) / total) * 100);
    let html = '<button type="button" class="back" data-act="back-topic">‹ Zurück</button>';

    html += '<div class="card" style="margin-top:16px">';
    if (question.passage) html += passageHtml(question.passage, st.index);
    html += '<p class="q">' + esc(question.prompt) + "</p>";

      options.forEach(function (option) {
        let cls = "opt";
        if (st.checked && st.chosen === option && st.ok) cls += " good";

        else if (st.chosen === option) cls += " chosen";

      const bg = st.checked ? (st.ok ? "var(--good-bg)" : "var(--bad-bg)") : "#fff";

    if (many.length) {
      html += '<p class="muted" style="margin-top:12px"><strong>Aufgaben mit vielen Versuchen</strong> (' + MANY_ATTEMPTS + " oder mehr):</p><ul class=\"warn-list\">";

        html += "<li>" + esc(item.label) + " · " + item.n + " Versuche · " + esc(item.prompt) + "</li>";

        html += '<h3 class="card-title sm" style="margin:14px 0 8px">' + esc(quiz.title) + "</h3>";
        quiz.questions.forEach(function (q, i) {

    if (resetConfirm) {

  function view() {
    if (screen.name === "topic") {
      const topic = findTopic(screen.topicId);
      return topic ? topicView(topic) : homeView();
    }
    if (screen.name === "quiz") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? quizView(quiz) : homeView();
    }
    if (screen.name === "result") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? resultView(quiz, screen) : homeView();
    }
    if (screen.name === "solutions") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      return quiz ? solutionsView(screen.topicId, screen.quizId) : homeView();
    }
    if (screen.name === "eltern") return elternView();
    return homeView();
  }

  function render() {
    document.getElementById("app").innerHTML = view();
    const input = document.getElementById("gap-input");
    if (input && quizState && !quizState.checked) {
      input.addEventListener("input", function () { quizState.typed = input.value; });
    }
    const pw = document.getElementById("pw-input");
    if (pw && !pwBusy) pw.focus();
  }

  async function checkAnswer(value) {
    if (!quizState || quizState.checked || !String(value).trim()) return;
    const quiz = findQuiz(screen.topicId, screen.quizId);
    const question = quiz.questions[quizState.index];
    const right = await isRight(screen.topicId, screen.quizId, quizState.index, value);
    const attemptNo = recordAttempt(screen.topicId, screen.quizId, quizState.index, value, right);
    const retry = attemptNo > 1;
    quizState.chosen = value;
    quizState.checked = true;
    quizState.ok = right;
    quizState.retry = retry;
    quizState.attemptNo = attemptNo;
    if (right) {
      quizState.runScore += 1;
      if (!retry) quizState.score += 1;
    } else {
      quizState.mistakes.push({ prompt: question.prompt, given: value, index: quizState.index });
    }
    render();
  }

  async function submitPassword(password, next) {
    if (pwBusy) return;
    pwBusy = true;
    pwError = "";
    render();
    try {
      if (next === "reset-log") {
        const key = await deriveKey(password, vault.salt);
        await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64dec(vault.iv) },
          key,
          b64dec(vault.ciphertext)
        );
        clearLog();
        resetConfirm = false;
        pwError = "";
        screen = { name: "eltern" };
        await queueIntegrity({ bump: true, parentReset: true, rerender: true });
      } else {
        await unlockWithPassword(password);
        screen.showPw = false;
        if (next === "eltern") screen = { name: "eltern" };
        else if (next === "solutions" || screen.name === "solutions") {
          screen = { name: "solutions", topicId: screen.topicId, quizId: screen.quizId };
        }
      }
    } catch (e) {
      pwError = "Das Passwort ist falsch.";
      if (next !== "reset-log") {
        unlocked = false;
        solutions = null;
      }
    }
    pwBusy = false;
    render();
  }

  function onClick(event) {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "password-form" || act === "check-form") return;
    const a = decodeURIComponent(el.getAttribute("data-arg") || "");
    if (act === "open-topic") {
      screen = { name: "topic", topicId: a };
      render();
    } else if (act === "home") {
      screen = { name: "home" };
      render();
    } else if (act === "start-quiz") {
      startQuiz(decodeURIComponent(el.getAttribute("data-topic") || ""), a);
    } else if (act === "back-topic") {
      screen = { name: "topic", topicId: screen.topicId };
      quizState = null;
      pwError = "";
      render();
    } else if (act === "pick") {
      checkAnswer(a);
    } else if (act === "next") {
      quizState.index += 1;
      quizState.typed = "";
      quizState.chosen = null;
      quizState.checked = false;
      quizState.ok = false;
      quizState.retry = false;
      quizState.attemptNo = 0;
      render();
    } else if (act === "finish") {
      const quiz = findQuiz(screen.topicId, screen.quizId);
      const official = officialFirstScore(screen.topicId, screen.quizId, quiz.questions.length);
      recordScore(screen.topicId, screen.quizId, official, quiz.questions.length);
      screen = {
        name: "result",
        topicId: screen.topicId,
        quizId: screen.quizId,
        score: official,
        runScore: quizState.runScore,
        total: quiz.questions.length,
        mistakes: quizState.mistakes,
        showPw: false
      };
      quizState = null;
      render();
    } else if (act === "retry") {
      startQuiz(screen.topicId, screen.quizId);
    } else if (act === "open-solutions") {
      const topicId = decodeURIComponent(el.getAttribute("data-topic") || screen.topicId);
      screen = { name: "solutions", topicId: topicId, quizId: a };
      pwError = "";
      render();
    } else if (act === "ask-password") {
      screen.showPw = true;
      pwError = "";
      render();
    } else if (act === "open-eltern") {
      screen = { name: "eltern" };
      pwError = "";
      resetConfirm = false;
      render();
    } else if (act === "ask-reset-log") {
      resetConfirm = true;
      pwError = "";
      render();
    }
  }

  function onSubmit(event) {
    const form = event.target.closest("form");
    if (!form) return;
    event.preventDefault();
    const act = form.getAttribute("data-act");
    if (act === "check-form") {
      const input = document.getElementById("gap-input");
      checkAnswer(input ? input.value : "");
    } else if (act === "password-form") {
      const input = document.getElementById("pw-input");
      submitPassword(input ? input.value : "", form.getAttribute("data-next") || "solutions");
    }
  }

  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("submit", onSubmit);
  render();
  queueIntegrity({ bump: true, rerender: true });
})();

  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js");
    });
  }
  </script>
</body>
